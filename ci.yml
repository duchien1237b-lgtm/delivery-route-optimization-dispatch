name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build + test (C++17)
        run: make -j4 && make test
      - name: Build single-file HTML and compare with C++
        run: |
          cd standalone && npm ci && cd ..
          node tools/build_standalone.mjs
          make diff-standalone
